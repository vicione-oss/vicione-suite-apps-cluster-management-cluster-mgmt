### Scripts ###
.activate_mise: &activate_mise
  - mise install
  - eval "$(mise env)"

.update_nuget_source_ro: &update_nuget_source_ro
  - dotnet nuget update source JFrogNuGetProxy --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text
  - dotnet nuget update source JFrogViciOne --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text

.update_nuget_source_rw: &update_nuget_source_rw
  - dotnet nuget update source JFrogViciOne --configfile NuGet.Config -u $NuGet_User_RW_JFrog -p $NuGet_PW_RW_JFrog --store-password-in-clear-text
  - dotnet nuget add source "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/nuget/index.json" --name GitLabRegistry --username gitlab-ci-token --password $CI_JOB_TOKEN --store-password-in-clear-text

.rule_tag: &rule_tag
  if: "$CI_COMMIT_TAG"

.rule_default_branch: &rule_default_branch
  if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

.rule_mr: &rule_mr
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.rule_web: &rule_web
  if: '$CI_PIPELINE_SOURCE == "web"'

.rules: &rules
  - *rule_tag
  - *rule_default_branch
  - *rule_mr
  - *rule_web

.rules_manual: &rules_manual
  - <<: *rule_tag
    when: manual
    allow_failure: true
  - <<: *rule_default_branch
    when: manual
    allow_failure: true
  - <<: *rule_mr
    when: manual
    allow_failure: true
  - <<: *rule_web
    when: manual
    allow_failure: true

.rules_manual_tag: &rules_manual_tag
  - <<: *rule_tag
    when: manual
    allow_failure: true
  - <<: *rule_default_branch
    when: manual
    allow_failure: true

### Defaults ###
variables:
  IMAGE_NAME: registry.gitlab.com/vicione-oss/tooling/base-image:vicione-stable
  RUNNER_TAG: saas-linux-small-amd64
  PROJECT_NAME: ClusterManagement
  MODULE_FULLNAME: ViciOne.Suite.ClusterManagement

stages:
  - metadata
  - build
  - test
  - pack
  - publish
  - release-dev
  - release-staging
  - release-public

### CI Components ###
include:
  ### Version calculation
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/version/version-calc@v1.2.0
  ### Runtime Identifier
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/module-packaging/runtime-identifier@v0.2.0
    inputs:
      project: "src/${PROJECT_NAME}.Deployment/${PROJECT_NAME}.Deployment.csproj"
      rules: *rules
      tags:
        - saas-linux-small-amd64
  ### Restore
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-restore@v2.7.1
    inputs:
      image: ${IMAGE_NAME}
      rules: *rules
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
      tags:
        - ${RUNNER_TAG}
  ### Renovate configuration validation
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/renovate/configuration-validation@v1.1.0
    inputs:
      rules: *rules
      tags:
        - ${RUNNER_TAG}
  ### Metadata for Module
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/module-packaging/metadata@v0.2.0
    inputs:
      project: "src/${PROJECT_NAME}.Deployment/${PROJECT_NAME}.Deployment.csproj"
      module_version: "${Version}"
      name: "Module Metadata"
      rules: *rules
      stage: metadata
      tags:
        - saas-linux-small-amd64
  ### Build
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-build@v2.7.1
    inputs:
      image: ${IMAGE_NAME}
      rules: *rules
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
      tags:
        - ${RUNNER_TAG}
  ### Test
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-test@v2.7.1
    inputs:
      image: ${IMAGE_NAME}
      rules: *rules
      filter: "/[(Category!=System)]"
      coverage: false
      config_file: tests/testconfig.json
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
      tags:
        - ${RUNNER_TAG}
  ### Pack NuGet
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-pack@v2.7.1
    inputs:
      name: "Pack NuGet ClusterManagement.Public"
      stage: "publish"
      image: ${IMAGE_NAME}
      project: "src/ClusterManagement.Public/ClusterManagement.Public.csproj"
      rules: *rules
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
  ### Push NuGet
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-nuget-push@v2.7.1
    inputs:
      pack_job_name: "Pack NuGet ClusterManagement.Public"
      name: "Push NuGet ClusterManagement.Public"
      stage: "release-dev"
      image: ${IMAGE_NAME}
      sources:
        - "JFrogViciOne"
        - "GitLabRegistry"
      filename_pattern: "./src/ClusterManagement.Public/*"
      rules: *rules
      before_script:
        - *activate_mise
        - *update_nuget_source_rw
  ### Publish Module
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/module-packaging/publish-module@v0.2.0
    inputs:
      module_name: "${PROJECT_NAME}"
      rules: *rules_manual
      image: "${IMAGE_NAME}"
      build_job: "dotnet Build"
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
        - apt update && apt install -y jq
      tags:
        - saas-linux-small-amd64
  ### Package Module
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/module-packaging/package-module@v0.2.0
    inputs:
      rules: *rules
      image: "${IMAGE_NAME}"
      before_script:
        - *activate_mise
        - apt update && apt install -y jq zip
      tags:
        - saas-linux-small-amd64
  ### Prerelease to dev repository
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/release@v2.1.1
    inputs:
      name: "Prerelease to JFrog"
      stage: release-dev
      rules: *rules_manual
      repository: "vicione-suite-dev"
      upload_path: "modules/${MODULE_FULLNAME}"
      needs:
        - "Package Module"
      artifacts:
        - "build/**/*"
  ### Release to staging (on tag)
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/release@v2.1.1
    inputs:
      name: "Release to JFrog"
      stage: release-staging
      rules: *rules_manual_tag
      repository: "vicione-suite-staging"
      upload_path: "modules/${MODULE_FULLNAME}"
      needs:
        - "Package Module"
      artifacts:
        - "build/**/*"
  ### Promote staging to production (on tag)
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/promote@v2.1.1
    inputs:
      name: "Public Release"
      stage: release-public
      rules: *rules_manual_tag
      source_repository: "vicione-suite-staging"
      destination_repository: "vicione-suite"
      remote_path: "modules/${MODULE_FULLNAME}"

### Override needs for "Pack NuGet ClusterManagement.Public" ###
Pack NuGet ClusterManagement.Public:
  needs:
    - "dotnet Build"
    - "Publish Module"
